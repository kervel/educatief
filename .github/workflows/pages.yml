name: Publiceer decks op GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages heeft deze rechten nodig; contents blijft read-only
permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk, maar een lopende deploy niet afbreken
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build-kiosk.sh draait zichzelf in een nix-shell (node, chromium,
      # mermaid, agent-illustrator, fonts), dus nix moet er zijn.
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bouw alle decks
        run: ./build-all.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
